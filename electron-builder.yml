appId: ai.harnessalign.desktop
productName: Harness Align
publish:
  provider: github
  owner: SnowyLake
  repo: HarnessAlign
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  executableName: HarnessAlign
  # Unsigned installers have no publisher identity, so Authenticode checks would reject every update.
  # The sha512 in latest.yml still verifies the downloaded installer. Set this to true after code signing.
  verifyUpdateCodeSignature: false
  target:
    - nsis
    - dir
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: HarnessAlign-${version}-setup.${ext}
  shortcutName: Harness Align
  uninstallDisplayName: Harness Align
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
