appId: ai.harnessalign.desktop
productName: Harness Align
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
win:
  icon: build/icon.ico
  executableName: HarnessAlign
  target:
    - nsis
    - dir
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: HarnessAlign-${version}-setup.${ext}
  shortcutName: Harness Align
  uninstallDisplayName: Harness Align
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
